<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidekick AI</title>
  <meta name="description" content="Sidekick AI">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #EDEAE3;
      font-family: 'Playfair Display', Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      position: relative;
      overflow-x: hidden;
    }

    .shape {
      position: absolute;
      top: 50%;
      right: 6vw;
      width: min(38vw, 30rem);
      transform: translateY(-50%);
      pointer-events: none;
    }

    @media (min-width: 901px) {
      body {
        padding-right: calc(min(38vw, 30rem) + 8vw);
      }
    }

    @media (max-width: 900px) {
      body {
        flex-direction: column;
      }

      .shape {
        position: static;
        align-self: flex-end;
        flex-shrink: 0;
        width: min(45vw, 14rem);
        margin-bottom: 2rem;
        transform: none;
      }
    }

    .content {
      position: relative;
      max-width: 640px;
      width: 100%;
    }

    .wordmark {
      font-size: clamp(2.2rem, 5.5vw, 4rem);
      font-weight: 900;
      letter-spacing: -0.025em;
      color: #252220;
      line-height: 1.0;
    }

    .wordmark em {
      font-style: italic;
      font-weight: 700;
      color: #5C574F;
    }

    .rule {
      margin-top: 1.75rem;
      border: none;
      border-top: 1px solid #C0B8AD;
      width: 3rem;
    }

    .login {
      margin-top: 1.75rem;
      max-width: 18rem;
      color: #4A453E;
    }

    .login label {
      display: block;
      margin-top: 1rem;
      font-size: 0.9rem;
    }

    .login input,
    .login button {
      display: block;
      width: 100%;
      margin-top: 0.35rem;
      padding: 0.6rem 0.75rem;
      font: inherit;
      font-size: 1rem;
      border: 1px solid #C0B8AD;
      border-radius: 2px;
    }

    .login input {
      background: transparent;
      color: #252220;
    }

    .login button {
      margin-top: 1.5rem;
      background: #252220;
      border-color: #252220;
      color: #EDEAE3;
      cursor: not-allowed;
    }

    .login input:disabled {
      cursor: not-allowed;
    }

    .login button:disabled {
      opacity: 0.6;
    }

    .date {
      margin-top: 2rem;
      font-size: 0.72rem;
      font-family: Georgia, serif;
      font-style: normal;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #9A9189;
    }
  </style>
</head>
<body>
  <svg class="shape" viewBox="0 0 400 400" aria-hidden="true" focusable="false">
    <circle cx="235" cy="165" r="135" fill="#C0B8AD" opacity="0.45"/>
    <polygon points="60,330 200,80 320,330" fill="#9A9189" opacity="0.35"/>
    <path d="M200 250 H360 A160 120 0 0 1 200 370 Z" fill="#5C574F" opacity="0.55"/>
    <circle cx="150" cy="170" r="105" fill="none" stroke="#4A453E" stroke-width="1"/>
    <line x1="30" y1="370" x2="370" y2="30" stroke="#252220" stroke-width="1"/>
    <circle cx="320" cy="80" r="9" fill="#252220"/>
  </svg>
  <div class="content">
    <p class="wordmark">Sidekick <em>AI</em></p>
    <hr class="rule">
    <!-- Decorative only: no <form>, no field names, so nothing can be submitted -->
    <div class="login">
      <label for="email">Email</label>
      <input type="email" id="email" disabled>
      <label for="password">Password</label>
      <input type="password" id="password" disabled>
      <button type="button" disabled>Log in</button>
    </div>
    <p class="date">November 2026</p>
  </div>
</body>
</html>
